<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050506">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Grok Desk">
  <title>Grok Desk · dry-run</title>
  <base href="./">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="nav">
    <button class="logo" id="avatar" type="button" aria-label="Account"><span data-ico="bot"></span></button>
    <div class="ttl">
      <div class="t1">Grok Desk</div>
      <div class="t2" id="nav-sub">dry-run via grokbot</div>
    </div>
    <span class="live" id="live-pill"><i></i><b>Live</b></span>
    <button class="ic" id="btn-search" type="button" aria-label="Search"><span data-ico="search"></span></button>
  </header>
  <div id="searchbar"><span data-ico="search"></span><input id="q" type="search" placeholder="Filter tokens and activity" autocomplete="off"></div>
  <div id="demo-banner" class="hidden">DEMO DATA · not real bot trades</div>
  <div id="offline">Cannot reach the dashboard. Retrying…</div>

  <main>
    <section id="view-home" class="view on"></section>
    <section id="view-agents" class="view"></section>
    <section id="view-activity" class="view"></section>
    <section id="view-account" class="view"></section>
    <section id="view-token" class="view"></section>
  </main>

  <nav id="tabs">
    <button type="button" data-tab="home" class="on"><span data-ico="home"></span>Home</button>
    <button type="button" data-tab="agents"><span data-ico="cpu"></span>Agents</button>
    <button type="button" data-tab="activity"><span data-ico="activity"></span>Activity</button>
    <button type="button" data-tab="account"><span data-ico="user"></span>Account</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
